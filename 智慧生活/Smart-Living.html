<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>校园帮 · 校园互助服务平台</title>
<style>
/* ============ Design Tokens ============ */
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --card2:#F2F4F8; --ink:#16181D;
  --txt2:#6E7583; --txt3:#8E95A3; --line:#EAECF1; --hairline:rgba(20,26,48,.05);
  --ac:#5B7CFA; --ac-deep:#4663E6; --ac-weak:#EEF2FF; --ac-ink:#3F5FE0;
  --ok:#1E7D5A; --ok-soft:#E6F5EE; --warn:#96691C; --warn-soft:#FAF1E0; --bad:#B23A47; --bad-soft:#FBEAEC;
  --shadow-sm:0 1px 2px rgba(16,22,40,.05);
  --shadow-md:0 6px 20px rgba(16,22,40,.08);
  --shadow-lg:0 18px 46px rgba(16,22,40,.14);
  --r-xs:8px; --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:22px; --r-full:999px;
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:20px; --sp6:28px;
  --dur:.2s; --ease:cubic-bezier(.25,.8,.3,1);
  --nav-h:52px; --tab-h:58px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#E7E9EE;font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;border:none;outline:none;background:none;color:var(--ink);font-size:15px}
img{-webkit-user-drag:none}
::selection{background:rgba(91,124,250,.22)}
::-webkit-scrollbar{width:0;height:0}
svg{display:block}
.icon{width:22px;height:22px}
/* ============ App Frame ============ */
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 60px rgba(24,32,64,.10);overflow-x:clip}
.screen{display:none;padding:0 var(--sp4) 72px;animation:screenIn .26s var(--ease)}
.screen.on{display:block}
@keyframes screenIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
/* ============ 顶部 ============ */
.hd{display:flex;align-items:flex-end;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 2px 10px}
.h1{font-size:27px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.hd .sub{font-size:12px;color:var(--txt2);margin-top:3px;display:flex;align-items:center;gap:4px}
.hd .acts{display:flex;gap:8px;align-items:center}
.hd-left{display:flex;align-items:center;gap:10px}
.icb{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--txt2);position:relative;box-shadow:var(--shadow-sm)}
.icb .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:#E5484D;border:1.5px solid #fff}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;height:40px;padding:0 13px;color:var(--txt3);font-size:13.5px;margin:12px 0 4px;cursor:pointer}
.search .icon{width:16px;height:16px}
/* 首页吸顶区：头部 + 搜索框 固定在顶部，滚动后轻微收拢 */
.home-top{position:sticky;top:0;z-index:40;background:var(--bg);
  margin:0 calc(-1 * var(--sp4));padding:0 var(--sp4) 8px;
  border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s;}
.home-top .hd{padding-left:0;padding-right:0}
.home-top .search{transition:height .2s var(--ease),font-size .2s var(--ease),margin .2s var(--ease)}
.home-top.collapsed{border-bottom-color:var(--line);box-shadow:0 6px 16px rgba(16,22,40,.05)}
.home-top.collapsed .search{height:34px;margin-top:6px;font-size:12.5px}

/* ============ 底部导航栏（复用 index.html tab-bar 代码） ============ */
#screens{flex:none}
#tabbar{position:fixed;bottom:calc(12px);left:50%;transform:translateX(-50%);
  width:calc(100% - 64px);max-width:208px;height:46px;
  background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  border:.5px solid rgba(0,0,0,.05);border-radius:var(--r-lg);
  box-shadow:0 4px 16px rgba(0,0,0,.06),0 1px 4px rgba(0,0,0,.03);
  display:flex;align-items:center;padding:4px 10px;gap:8px;z-index:100;}
#tabbar .tab-item{flex:1;height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:var(--r-sm);cursor:pointer;color:#929292;transition:color .25s;-webkit-tap-highlight-color:transparent}
#tabbar .tab-item svg{width:19px;height:19px;color:#929292;transition:color .25s,transform .25s cubic-bezier(.22,1,.36,1)}
#tabbar .tab-item svg path,#tabbar .tab-item svg circle,#tabbar .tab-item svg polyline,#tabbar .tab-item svg rect,#tabbar .tab-item svg line,#tabbar .tab-item svg polygon{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:fill .25s,stroke .25s,stroke-width .25s}
#tabbar .tab-item.on{color:var(--ac-ink)}
#tabbar .tab-item.on svg{color:var(--ac-ink);transform:scale(1.06)}
#tabbar .tab-item.on svg path,#tabbar .tab-item.on svg circle,#tabbar .tab-item.on svg polyline,#tabbar .tab-item.on svg rect,#tabbar .tab-item.on svg line,#tabbar .tab-item.on svg polygon{fill:currentColor;stroke:currentColor;stroke-width:1.5}
#tabbar .tab-item span{font-size:10px;font-weight:500;color:inherit}
#tabbar .tab-item.on span{font-weight:600;color:var(--ac-ink)}
.no-bar #tabbar{display:none!important}
.no-bar .screen{padding-bottom:0}
/* ============ 通用组件 ============ */
.card{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.row{display:flex;align-items:center;gap:10px}
.space{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:6px}
.grow{flex:1;min-width:0}
.muted{color:var(--txt2)} .faint{color:var(--txt3)}
.small{font-size:12px} .xs{font-size:10.5px}
.b{font-weight:600} .hb{font-weight:800}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sec b{font-size:17px;font-weight:800;letter-spacing:-.2px}
.sec a{font-size:12px;color:var(--txt2);display:flex;align-items:center;gap:1px}
.sec a .icon{width:13px;height:13px}
.divider{height:1px;background:var(--hairline);margin:var(--sp3) 0}
/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;border-radius:12px;font-size:15px;font-weight:600;background:var(--ac-deep);color:#fff;transition:transform .12s var(--ease),filter .15s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.975)}
.btn.primary{background:linear-gradient(135deg,#5E7DF2,#4663E6);box-shadow:0 6px 16px rgba(70,99,230,.25)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.soft{background:var(--ac-weak);color:var(--ac-ink)}
.btn.danger-ghost{background:var(--bad-soft);color:var(--bad)}
.btn.sm{height:32px;padding:0 14px;font-size:13px;border-radius:10px}
.btn.mini{height:28px;padding:0 12px;font-size:12px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
/* chip / 分段 / 筛选 */
.chip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 14px;border-radius:var(--r-full);background:var(--card);border:1px solid var(--line);color:var(--txt2);font-size:13px;white-space:nowrap;cursor:pointer;transition:all .15s var(--ease)}
.chip.on{background:var(--ac-deep);border-color:transparent;color:#fff;font-weight:600}
.chip:disabled{opacity:.4;pointer-events:none}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.seg{display:flex;background:#ECEFF4;border-radius:11px;padding:3px;gap:2px}
.seg .si{flex:1;text-align:center;height:32px;line-height:32px;border-radius:9px;font-size:13px;color:var(--txt2);cursor:pointer;transition:all .18s var(--ease)}
.seg .si.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(16,22,40,.12)}
/* 状态胶囊 */
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:var(--r-full);font-size:11.5px;font-weight:600}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.pending{background:#F0F2F5;color:#6E7583}
.pill.go{background:var(--ac-weak);color:var(--ac-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ghost-p{background:#fff;border:1px solid var(--line);color:var(--txt2)}
.pill.ghost-p::before{display:none}
/* 行内列表 */
.li{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 2px;cursor:pointer}
.li + .li{border-top:1px solid var(--hairline)}
.li .ch{color:#C9CDD6;width:16px;height:16px;flex:none}
.li:active{background:var(--card2)}
/* switch */
.switch{width:46px;height:28px;border-radius:14px;background:#DDE1E8;position:relative;flex:none;transition:background .2s;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:left .2s var(--ease)}
.switch.on{background:var(--ok)}
.switch.on::after{left:20px}
/* 数量步进 */
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:32px;height:32px;font-size:18px;color:var(--txt2);background:var(--card)}
.stepper b{width:34px;text-align:center;font-size:14px}
/* 详情行 */
.fr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0}
.fr + .fr{border-top:1px solid var(--hairline)}
.fr .l{font-size:13px;color:var(--txt2);display:flex;align-items:center;gap:7px;white-space:nowrap}
.fr .l .icon{width:15px;height:15px;color:#AAB1BF}
.fr .v{font-size:14px;font-weight:600;text-align:right;display:flex;align-items:center;gap:6px}
.fr .v .icon{width:15px;height:15px;color:#C9CDD6}
/* 输入 */
.inp{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;height:44px;padding:0 13px;font-size:15px;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(91,124,250,.14)}
textarea.inp{height:84px;padding:11px 13px;resize:none;line-height:1.55}
.inpw{position:relative}
.inpw .hint{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--txt3);pointer-events:none}
label.fl{display:block;font-size:12px;color:var(--txt2);margin:14px 2px 7px}
/* 选择格 */
.gcell{border:1px solid var(--line);border-radius:var(--r-md);padding:13px 8px;text-align:center;background:#fff;cursor:pointer;transition:all .15s var(--ease)}
.gcell .icon{width:22px;height:22px;margin:0 auto 6px;color:#9AA3B2}
.gcell b{font-size:13px;display:block}
.gcell small{font-size:10.5px;color:var(--txt3);display:block;margin-top:2px}
.gcell.on{border-color:var(--ac);background:var(--ac-weak)}
.gcell.on b,.gcell.on small{color:var(--ac-ink)}
.gcell.on .icon{color:var(--ac-ink)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
/* 顶部操作条页面(非Tab) */
.bar{display:flex;align-items:center;gap:6px;padding:calc(12px + env(safe-area-inset-top)) 0 6px;position:relative}
.bar .bk{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--ink);cursor:pointer}
.bar .bk:active{background:var(--card2)}
.bar .tt{flex:1;text-align:center;font-size:16.5px;font-weight:700;margin-right:34px;letter-spacing:-.1px}
.bar .tr{font-size:12.5px;color:var(--txt2);white-space:nowrap;cursor:pointer}
/* 底部操作条 */
.actbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:10px var(--sp4) calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;z-index:55}
.actbar .sum{font-size:12px;color:var(--txt2);line-height:1.35}
.actbar .sum b{font-size:17px;color:var(--ink);letter-spacing:-.2px}
/* 任务/订单卡 */
.task{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;margin-bottom:11px;cursor:pointer;transition:box-shadow .2s,border-color .2s,transform .12s var(--ease);box-shadow:var(--shadow-sm)}
.task:active{transform:scale(.992)}
.task .t-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.task .ttl{font-size:15px;font-weight:700;line-height:1.4;margin:0 0 4px;letter-spacing:-.1px}
.task .rtl{font-size:12px;color:var(--txt2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.task .foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;padding-top:10px;border-top:1px solid var(--hairline)}
.fee{font-size:17px;font-weight:800;letter-spacing:-.2px}
.fee small{font-size:11px;font-weight:500;color:var(--txt3)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#E9EEFF,#F2F6FF);border:1px solid #DCE4FA;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--ac-ink);flex:none}
.avatar.lg{width:56px;height:56px;font-size:22px}
.avatar.sm{width:30px;height:30px;font-size:13px}
/* 步骤条 */
.steps{display:flex;margin:6px 0 2px}
.st{flex:1;text-align:center;position:relative;padding-top:15px;font-size:11px;color:var(--txt3)}
.st::before{content:'';position:absolute;top:3px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:#D5DAE3;z-index:2}
.st::after{content:'';position:absolute;top:7px;left:calc(50% + 8px);width:calc(100% - 16px);height:1.5px;background:#E3E6EC}
.st:last-child::after{display:none}
.st.on{color:var(--ink);font-weight:600}
.st.on::before{background:var(--ac);width:12px;height:12px;top:1.5px}
.st.done{color:var(--txt2)}
.st.done::before{background:var(--ok)}
.st.done::after{background:var(--ok)}
/* 时间轴 */
.tl{padding:4px 0}
.tl .tv{display:flex;gap:12px;position:relative;padding:0 0 14px}
.tl .tv:last-child{padding-bottom:2px}
.tl .tv::before{content:'';position:absolute;left:4px;top:14px;bottom:0;width:1.5px;background:var(--line)}
.tl .tv:last-child::before{display:none}
.tl .tdot{width:10px;height:10px;border-radius:50%;background:var(--ac);flex:none;margin-top:4px;position:relative;z-index:1}
.tl .tv.done .tdot{background:var(--ok)}
.tl .tv.doing .tdot{background:var(--warn)}
.tl .tmt{font-size:11px;color:var(--txt3);min-width:44px;flex:none;margin-top:2px}
.tl .ttx{font-size:13px;color:var(--ink)}
.tl .ttx small{display:block;font-size:11px;color:var(--txt3);margin-top:1px}
/* 消息气泡 */
.msg{display:flex;margin:11px 0}
.msg.me{justify-content:flex-end}
.bub{max-width:78%;padding:10px 13px;font-size:14px;line-height:1.55;border-radius:16px;background:#fff;border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.msg.me .bub{background:var(--ac-weak);border-color:transparent;border-radius:16px 16px 4px 16px}
.sysc{display:flex;justify-content:center;margin:14px 0}
.sysc span{font-size:11px;color:var(--txt3);background:#F0F2F5;border-radius:8px;padding:4px 11px;text-align:center}
/* 覆盖层 */
.scrim{position:fixed;inset:0;background:rgba(18,24,44,.45);z-index:110;opacity:0;visibility:hidden;transition:.22s}
.scrim.on{opacity:1;visibility:visible}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(104%);width:100%;max-width:430px;background:var(--bg);border-radius:24px 24px 0 0;padding:8px var(--sp4) calc(18px + env(safe-area-inset-bottom));z-index:111;transition:transform .3s var(--ease);max-height:88%;overflow-y:auto;scrollbar-width:none}
.sheet.on{transform:translateX(-50%) translateY(0)}
.grip{width:38px;height:4.5px;border-radius:4px;background:#DFE2EA;margin:6px auto 14px}
.sh-t{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px}
.sh-t b{font-size:16.5px;font-weight:800}
.sh-x{width:28px;height:28px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--txt2)}
.page{position:fixed;inset:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg);z-index:65;display:none;flex-direction:column;animation:pageIn .24s var(--ease)}
.page.on{display:flex}
@keyframes pageIn{from{opacity:0;transform:translateX(-50%) translateX(26px)}to{opacity:1;transform:translateX(-50%) translateX(0)}}
.page-body{flex:1;overflow-y:auto;padding:0 var(--sp4) 32px;overscroll-behavior:contain;scrollbar-width:none}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);width:min(330px,88%);background:#fff;border-radius:20px;padding:22px 20px 16px;z-index:120;opacity:0;visibility:hidden;transition:.18s;box-shadow:var(--shadow-lg)}
.dlg.on{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
.dlg h4{font-size:17px;font-weight:800;margin-bottom:6px}
.dlg p{font-size:13px;color:var(--txt2);line-height:1.65;margin-bottom:18px;white-space:pre-line}
.dlg .btns{display:flex;gap:10px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-12px);background:rgba(20,24,40,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:var(--r-full);z-index:130;opacity:0;visibility:hidden;transition:.22s var(--ease);max-width:84%;text-align:center;line-height:1.5;pointer-events:none}
.toast.on{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.empty{padding:52px 0;text-align:center;color:var(--txt3)}
.empty .em{font-size:40px;margin-bottom:12px}
.empty b{display:block;font-size:15px;color:var(--ink);margin-bottom:4px}
.empty span{font-size:12.5px;color:var(--txt2);display:block;margin-bottom:16px}
.empty .btn{width:min(220px,80%)}
/* 空/加载骨架(本地即时数据,提供统一占位样式) */
.sk{background:linear-gradient(90deg,#F0F2F5 25%,#E7EAF0 37%,#F0F2F5 63%);background-size:400% 100%;animation:sk 1.2s ease infinite;border-radius:10px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
/* 聚焦 / 悬停 / 动效偏好 */
button:focus-visible,.chip:focus-visible,.seg .si:focus-visible,.switch:focus-visible,.li:focus-visible{outline:2.5px solid var(--ac-ink);outline-offset:2px}
@media (hover:hover){
  .btn:hover:not(:disabled){filter:brightness(1.05)}
  .chip:hover{border-color:#BFC9EC;color:var(--ac-ink)}
  .task:hover{border-color:#D6DDF5;box-shadow:var(--shadow-md)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.over-scroll{overscroll-behavior:contain}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2.5px 9px;border-radius:999px;font-size:10.5px;font-weight:600}
.icon.ch{width:15px;height:15px;color:#C9CDD6;flex:none}
.fsec{font-size:12px;color:var(--txt2);margin:14px 2px 7px;font-weight:600}
/* ===== Hero 顶部动画组件（复用首页顶部搜索下轮播，v2 升级：进度指示点/减弱动效适配/滑动暂停） ===== */
.hero{position:relative;margin-top:14px;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-sm);cursor:pointer}
.hero-track{display:flex;transition:transform .55s cubic-bezier(.25,.8,.3,1)}
.hero-slide{flex:0 0 100%;min-width:100%;min-height:106px;padding:15px 16px 20px;display:flex;align-items:center;gap:13px;position:relative;overflow:hidden}
.hero-slide::after{content:'';position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.45);top:-58px;right:-42px;pointer-events:none}
.hero-slide .h-ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;background:rgba(255,255,255,.7);box-shadow:0 3px 12px rgba(30,40,90,.07)}

.hs1{background:linear-gradient(135deg,#E9F7F1,#F7FCF9)}
.hs2{background:linear-gradient(135deg,#FEF2E6,#FFF9F1)}
.hero-dots{position:absolute;left:16px;bottom:10px;display:flex;gap:6px;align-items:center;z-index:2}
.hero-dots i{width:5px;height:5px;border-radius:3px;background:rgba(30,40,90,.16);transition:width .3s;display:block;overflow:hidden}
.hero-dots i.on{width:17px;background:rgba(91,124,250,.18)}
.hero-dots i.on.play::after{content:'';display:block;height:100%;border-radius:3px;background:var(--ac);animation:heroFill 4.5s linear forwards}
.hero-dots i.on:not(.play)::after{content:'';display:block;height:100%;width:100%;border-radius:3px;background:var(--ac)}
@keyframes heroFill{from{width:0}to{width:100%}}

<script>
'use strict';
/* ================= 基础工具 ================= */
var $=function(s){return document.querySelector(s);};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(p){return (p||'id')+Date.now()+Math.floor(Math.random()*1000);}
function pad2(n){return (n<10?'0':'')+n;}
function nowHM(){var d=new Date();return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function hmAgo(min){var d=new Date(Date.now()-min*60000);return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function dayLabel(ts){var d=new Date(ts);var t=todayStr();var y=new Date(Date.now()-864e5);var ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();var s=(d.getMonth()+1)+'月'+d.getDate()+'日';var ds=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();if(ds===t)return '今天 '+pad2(d.getHours())+':'+pad2(d.getMinutes());if(ds===ys)return '昨天 '+pad2(d.getHours())+':'+pad2(d.getMinutes());return s;}
var LS='xyb_v2', LS_OLD='xyb_v1';
function creditNow(){return S.credit;}
/* ================= 数据 ================= */
function seedState(){var now=Date.now();
  return {
    version:2, onboarded:false,

    credit:850, creditLog:[{t:dayLabel(now-3*864e5),x:'按时完成帮送 · +2',d:2}],
    balance:128.6, month:86,
    bills:[
      {n:'帮送 · 赏金结算',t:'昨天 16:40',amt:4,cat:'in'},

    ],

      {id:'a1',tag:'宿舍',loc:'6号楼',room:'408',def:true},

    ],
    coupons:[
      {id:'c1',amt:2,min:0,title:'发布立减 ¥2',scope:'express,bangsong',used:false,exp:'30天内有效'},

      {id:'n1',cat:'system',t:'欢迎使用校园帮',x:'发布求助或接单都能赚积分、攒信用。请先完成校园认证并查看平台规则。',time:'今天 09:00',read:false},

    ],

      {id:'o1',no:'XY20260903001',role:'pub',type:'express',title:'帮取2个快递·送至6号楼408',from:'菜鸟驿站',to:'6号楼·408宿舍',fee:3.5,couponAmt:0,status:'delivering',phase:'moving',rider:'王明',code:'6-2-3456',depot:'丰巢柜',eta:'预计 12:30 前送达',time:'今天 12:10',created:now-22*60000,rated:false,
       events:[{t:hmAgo(22),x:'你发布了求助（赏金 ¥3.50）'},{t:hmAgo(16),x:'王明 接单了'},{t:hmAgo(10),x:'王明 已取件'},{t:hmAgo(6),x:'王明 开始配送'}],
       msgs:[

       events:[{t:hmAgo(33),x:'你发布了代买求助（赏金 ¥5.00）'}],msgs:[]},
      {id:'o3',no:'XY20260902005',role:'pub',type:'bangsong',title:'送入党材料·行政楼302',from:'图书馆',to:'行政楼·302',fee:4,couponAmt:0,status:'done',phase:'done',rider:'',eta:'',time:'昨天 16:40',created:now-26*3600000,rated:true,rating:5,tag:'速度很快',
       events:[{t:'昨天 16:02',x:'你发布了帮送求助'},{t:'昨天 16:10',x:'同学接单'},{t:'昨天 16:40',x:'送达并完成结算'},{t:'昨天 16:45',x:'你已评价 ★5'}],msgs:[]}
    ]

}
function migrateOld(old){
  var s=seedState(); if(!old) return s;
  s.verified=old.verified!==false; s.balance=old.balance||s.balance; s.month=old.month||s.month;
  s.counter=old.counter||s.counter; s.credit=(old.credit==null?850:old.credit);
  if(old.bills&&old.bills.length)s.bills=old.bills;
  s.grabbed=old.grabbed||[];
  if(old.orders&&old.orders.length){
    s.orders=old.orders.map(function(o){
      var n=Object.assign({phase:'',eta:'',no:'XY'+Date.now(),events:[],msgs:o.msgs||[]},o);
      if(n.status==='delivering'&&!n.phase)n.phase='moving';
      if(!n.events.length)n.events=[{t:n.time||'今天',x:'订单创建'}];
      return n;
    });
  }
  return s;
}
function load(){try{var v=localStorage.getItem(LS);if(v){var p=JSON.parse(v);if(p.version===2)return p;return migrateOld(p);}var o=localStorage.getItem(LS_OLD);if(o){var m=migrateOld(JSON.parse(o));m.onboarded=false;return m;}}catch(e){}return seedState();}
var S=load();
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function dayReset(){var t=todayStr();if(S.lastDay!==t){S.lastDay=t;save();}}
/* ================= 浮层与反馈 ================= */
var toastTimer=null;
function toast(msg){var t=$('#toast');t.innerHTML=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on');},2100);}
function vibrate(ms){try{if(navigator.vibrate&&S.settings&&S.settings.vibrate!==false)navigator.vibrate(ms);}catch(e){}}
function dlgShow(title,desc,yes,cb,danger){$('#dlgT').textContent=title;$('#dlgD').innerHTML=esc(desc).replace(/\n/g,'<br>');var y=$('#dlgYes');y.textContent=yes||'确定';y.className='btn'+(danger?'':' ');$('#dlgNo').onclick=function(){closeDlg();};y.onclick=function(){closeDlg();if(cb)cb();};$('#dlg').classList.add('on');}
function closeDlg(){$('#dlg').classList.remove('on');}
function sheetOn(html){$('#scrim').classList.add('on');$('#sheetRoot').innerHTML='<div class="sheet"><div class="grip"></div>'+html+'</div>';requestAnimationFrame(function(){var s=$('#sheetRoot .sheet');if(s)s.classList.add('on');});}
function closeSheet(){$('#scrim').classList.remove('on');var s=$('#sheetRoot .sheet');if(s){s.classList.remove('on');setTimeout(function(){$('#sheetRoot').innerHTML='';},260);}else{$('#sheetRoot').innerHTML='';}}
$('#scrim').addEventListener('click',closeSheet);
function vibr8(v){vibrate(v);}
/* ================= 导航 ================= */
var TABS=['home','me'];
var stack=['home'];
function go(name){$$('.screen').forEach(function(x){x.classList.remove('on');});var el=$('#sc-'+name);if(el){el.classList.add('on');}
  syncTabbar();
  if(TABS.indexOf(name)>=0){stack=[name];}else if(stack[stack.length-1]!==name){stack.push(name);}
  window.scrollTo(0,0);syncHomeTop();syncBar();}
function goTab(name){$$('.screen').forEach(function(x){x.classList.remove('on');});var el=$('#sc-'+name);if(el)el.classList.add('on');stack=[name];syncTabbar();window.scrollTo(0,0);syncHomeTop();syncBar();}
function back(){if(stack.length>1)stack.pop();var p=stack[stack.length-1]||'home';if(TABS.indexOf(p)>=0)goTab(p);else go(p);syncHomeTop();syncBar();}
/* 返回校园主页：若来自 index.html，用 history.back() 走 bfcache 秒回（状态、滚动位置保留，不新增历史记录，返回键不会一级级退回旧页面）；否则 replace 回主页（不压栈） */
function smartBack(){try{var r=document.referrer?new URL(document.referrer,location.href):null;if(r&&r.origin===location.origin&&/(^|\/)index\.html$/.test(r.pathname)){window.history.back();return;}}catch(e){}location.replace(new URL('../index.html',location.href).href);}
function activeTab(){for(var i=stack.length-1;i>=0;i--){if(TABS.indexOf(stack[i])>=0)return stack[i];}return TABS[0];}
function syncTabbar(){var onTab=activeTab();$$('.si').forEach(function(t){t.classList.toggle('on',t.getAttribute('data-tab')===onTab);});}
function syncHomeTop(){var ht=$('#homeTop');if(!ht)return;var on=$('#sc-home')&&$('#sc-home').classList.contains('on');if(!on){ht.classList.remove('collapsed');return;}ht.classList.toggle('collapsed',window.scrollY>40);}
window.addEventListener('scroll',syncHomeTop,{passive:true});
var HIDE_BAR=['orders','msg'];
function syncBar(){var top=stack[stack.length-1];var hide=HIDE_BAR.indexOf(top)>=0;var app=$('#app');if(app)app.classList.toggle('no-bar',hide);}

function addEvent(o,x){if(!o.events)o.events=[];o.events.push({t:nowHM(),x:x});save();}
function addNotif(cat,t,x,oid){S.notifs.unshift({id:uid('n'),cat:cat,t:t,x:x,time:'刚刚',read:false,oid:oid||null});S.notifs=S.notifs.slice(0,60);save();refreshDots();}
function markNotifRead(n){if(!n.read){n.read=true;save();refreshDots();}}
function markAllRead(){S.notifs.forEach(function(n){n.read=true;});save();refreshDots();toast('已全部标记为已读');renderMsg();}
function creditDelta(d,why){S.credit=Math.max(0,S.credit+(d||0));S.creditLog.unshift({t:dayLabel(Date.now()),x:why,d:d});save();renderMe();}
function addBill(n,amt,cat,note){S.bills.unshift({n:n,t:'今天 '+nowHM(),amt:amt,cat:cat,note:note||''});S.bills=S.bills.slice(0,80);}
function income(fee,label){S.balance=+(S.balance+fee).toFixed(2);S.month=+(S.month+fee).toFixed(2);addBill(label||'互助赏金 · 结算',fee,'in');save();}
function outcome(amt,n){S.balance=+(S.balance-amt).toFixed(2);addBill(n,-amt,'out');save();}
function incCounter(k){if(k==='pub'){S.counter.pub++;}else{S.counter.take++;}save();}

  else if(o.status==='done')pill='<span class="pill ok">已完成'+(o.rated?' · 已评价':'')+'</span>';
  else pill='<span class="pill ghost-p">已取消</span>';

  var coupon=o.couponAmt>0?'<span class="xs faint" style="color:var(--warn)">券-¥'+(+o.couponAmt).toFixed(2)+'</span>':'';

   '<div class="t-top"><span class="xs faint">'+esc(o.no||'')+'</span>'+roleTag+'<span style="margin-left:auto">'+pill+'</span></div>'+
   '<div class="ttl" style="font-size:14.5px">'+TYP[o.type].n+' · '+esc(o.title)+'</div>'+

function ordMatch(o){
  if(OF.role!=='all'){if(OF.role==='pub'&&o.role!=='pub')return false;if(OF.role==='take'&&o.role!=='take')return false;}
  if(OF.st!=='all'){var m={pending:'pending',going:'delivering',done:'done',cancel:'cancel'};if((m[OF.st]||'')!==o.status)return false;}
  return true;
}

  var h='';for(var i=0;i<4;i++){
    var cls='';if(i<idx)cls='done';else if(i===idx&&o.status!=='cancel')cls='on';
    if(i===2&&o.phase==='moving')cls='on';
    if(i===3&&o.status==='done')cls='done';

  }

}

    case 'stats': renderStats();go('stats');break;
    case 'help': renderHelp();go('help');break;
    case 'auth': renderAuthState();go('auth');break;
    case 'msg': renderMsg();refreshDots();go('msg');break;
    case 'msg-allread': markAllRead();break;
    case 'orders': renderOrders();go('orders');break;
    case 'edit': profileEdit();break;
    case 'pubsheet': openPubSheet();break;
    case 'moresheet': toast('代打印 / 拼车 / 二手等模块正在建设中，敬请期待');break;
    case 'promo': renderHelp();go('help');break;
    case 'withdraw': dlgShow('提现','可提现余额 ¥'+S.balance.toFixed(2)+'（全部）\n1-3 个工作日到账，单笔最低 ¥1。','确认提现',function(){if(S.balance<1){toast('余额不足 ¥1');return;}outcome(S.balance,'提现 · 微信');renderWallet();renderMe();toast('提现申请已提交');});break;
    case 'topup': toast('演示环境：充值功能未开放');break;
    case 'addr-add': addrSheet(null);break;
    case 'doPub': {var k=curPubName();if(k)doPub(k);}break;
    case 'nudge': if(curO)nudgeO(curO);break;
    case 'cancelPub': if(curO)cancelPubO(curO);break;
    case 'pubConfirm': if(curO)pubConfirm(curO);break;
    case 'riderPick': if(curO)riderPick(curO);break;
    case 'riderDone': if(curO)riderDone(curO);break;
    case 'chat': if(curO)goChat();break;
    case 'call': toast('虚拟号 138****2046（演示）');break;
    case 'rateNow': if(curO&&!curO.rated)openRating(curO.id);break;
    case 'again': {var ty=curO?curO.type:'express';openPub(ty);toast('已为你带入常用信息');}break;
    case 'tl': if(curO)viewTL(curO);break;
    case 'order-more': orderMore();break;
    case 'cs': toast('在线客服 8:00-23:00 · 热线 400-800-2024（演示）');break;
    case 'authSubmit': submitAuth();break;
    case 'setting': renderSetting();break;
    case 'onboard': obShow();break;
    case 'simday': simDay();break;
    case 'reset': dlgShow('清空演示数据','将重置订单、钱包、信用等全部本地数据，确定继续吗？','清空',function(){localStorage.removeItem(LS);localStorage.removeItem(LS_OLD);location.reload();},true);break;
  }
}
function profileEdit(){sheetOn('<div class="sh-t"><b>编辑资料</b><button class="sh-x" data-sheetx>✕</button></div>'+
 '<label class="fl">昵称</label><input class="inp" id="edName" value="'+esc(S.name)+'" maxlength="10">'+
 '<label class="fl">个性签名</label><input class="inp" id="edSign" placeholder="一句话介绍自己" value="'+esc(S.sign||'')+'">'+
 '<div style="display:flex;gap:10px;margin-top:18px"><button class="btn block" data-edsave>保存</button></div>');}
function submitRating(){
  if(!rtO)return;if(rtStars===0){toast('请先打分');return;}
  rtO.rated=true;rtO.rating=rtStars;rtO.tag=rtSelTag;
  if(rtTip>0){outcome(rtTip,'打赏 · '+(rtO.rider||'接单同学'));}
  if(rtO.role==='pub'){creditDelta(1,'完成确认与评价');}
  addNotif('interact','评价成功','你已完成对本次互助的评价',rtO.id);
  save();renderOrders();renderMe();toast('评价成功，感谢反馈');
  go('orders');
}
function submitAuth(){
  if(S.verified){toast('你已通过校园认证');return;}
  var up=$('#authUp');if(up&&!up.classList.contains('done')){toast('请先上传学生证照片');return;}
  S.verified=true;creditDelta(50,'通过校园实名认证');save();renderMe();renderAuthState();toast('认证通过 · 信用 +50');back();
}
function simDay(){
  S._cpDate='';S.notifs.unshift({id:uid('n'),cat:'system',t:'模拟新的一天',x:'任务与每日券已刷新，今天也要元气满满 ✨',time:'刚刚',read:false});
  save();renderMsg();refreshDots();toast('已模拟新的一天');}
function renderAddr(){addrListHtml();}

/* ================= 次要监听（与主委托互补） ================= */
document.addEventListener('click',function(e){
  var t=e.target;
  var cp=t.closest('[data-coupon]');if(cp){couponSheet(cp.getAttribute('data-coupon'));return;}
  var ed=t.closest('[data-edsave]');if(ed){var n=$('#edName');if(n&&(n.value||'').trim()){S.name=n.value.trim();save();renderMe();}var sg=$('#edSign');if(sg){S.sign=sg.value.trim();save();}closeSheet();toast('资料已更新');return;}
  var ss=t.closest('[data-saveset]');if(ss){save();closeSheet();toast('设置已保存');return;}
  var au=t.closest('#authUp');if(au&&!S.verified){$('#authFile').click();return;}
});
document.addEventListener('input',function(e){
  var id=e.target&&e.target.id||'';
  if(id.indexOf('_fee')>=0){calcCurPub();}
  if(id==='searchInput'){doSearch();}
});
var _ci=$('#chatInput');if(_ci)_ci.addEventListener('keydown',function(e){if(e.key==='Enter'){sendChat();}});
var _af=$('#authFile');if(_af)_af.addEventListener('change',function(){var f=this.files&&this.files[0];if(f){var t=$('#authUpT');if(t)t.textContent=(f.name.length>16?f.name.slice(0,16)+'…':f.name);var up=$('#authUp');if(up){up.classList.add('done');up.style.borderColor='var(--ac)';up.style.color='var(--ac-ink)';}}});
$('#hiddenFile')&&$('#hiddenFile').addEventListener('change',function(){});
/* ================= 30分钟自动取消 & 倒计时 ================= */
function tickRun(){
  var changed=false;
  S.orders.forEach(function(o){if(o.status==='pending'&&!o._a&&Date.now()-o.created>30*60000){
    o._a=true;o.status='cancel';o.eta='';if(!o.events)o.events=[];o.events.push({t:nowHM(),x:'超过 30 分钟无人接单，系统自动取消'});addNotif('order','求助已自动取消','「'+o.title.slice(0,14)+'…」超时未接单已自动取消',o.id);changed=true;}});
  if(changed){save();if($('#sc-orders').classList.contains('on'))renderOrders();if(curO&&curO.status==='pending')renderDetail();}
  var p=$('#pendTime');if(p&&curO){var r=Math.max(0,30-Math.round((Date.now()-curO.created)/60000));p.textContent='剩 '+r+' 分钟';if(r===0&&curO.status==='pending')renderDetail();}
}
setInterval(tickRun,15000);
/* ================= 构建屏幕 & 启动 ================= */
function addScreen(fn){var s=fn();if(s)$('#screens').appendChild(s);}
/* ================= Hero 顶部轮播（复用首页顶部搜索下轮播并升级） ================= */
var HERO=[
  {ic:'🛡️',t:'学生认证 · 免押金发布',s:'信用 +50 · 专属券 · 更受同学信任',cta:'去认证',act:'auth',c:'hs0'},
  {ic:'🎟️',t:'新人券已到账',s:'发布立减 ¥2 · 差额由平台补贴',cta:'去使用',act:'coupon',c:'hs1'},
  {ic:'🚀',t:'本周已撮合 2,300+ 单',s:'同楼顺路优先 · 好信用接单更快',cta:'去接单',act:'hall',c:'hs2'}
];
var heroI=0,heroTimer=null;
function heroGo(i){
  heroI=(i+HERO.length)%HERO.length;
  var tr=$('#heroTrack');if(tr)tr.style.transform='translateX(-'+(heroI*100)+'%)';
  $$('#heroDots i').forEach(function(d,x){
    d.classList.toggle('on',x===heroI);
    d.classList.remove('play');
    if(x===heroI){void d.offsetWidth;d.classList.add('play');}
  });
}
function heroStop(){clearInterval(heroTimer);heroTimer=null;$$('#heroDots i').forEach(function(d){d.classList.remove('play');});}
function heroStart(){heroStop();if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;heroTimer=setInterval(function(){heroGo(heroI+1);},4500);}
function buildHero(){
  var tr=$('#heroTrack'),dots=$('#heroDots');if(!tr)return;
  tr.innerHTML=HERO.map(function(s){return '<div class="hero-slide '+s.c+'" data-act="'+s.act+'"><span class="h-ic">'+s.ic+'</span><div class="h-t"><b>'+s.t+'</b><span>'+s.s+'</span></div><span class="hero-cta">'+s.cta+'<svg class="icon" style="width:12px;height:12px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></span></div>';}).join('');
  dots.innerHTML=HERO.map(function(s,x){return '<i'+(x===0?' class="on play"':'')+' data-hero="'+x+'"></i>';}).join('');
  dots.addEventListener('click',function(e){var d=e.target.closest('[data-hero]');if(d){heroStop();heroGo(+d.getAttribute('data-hero'));heroStart();}});
  var hx=null,sw=false;
  tr.addEventListener('touchstart',function(e){hx=e.touches[0].clientX;sw=true;heroStop();},{passive:true});
  tr.addEventListener('touchend',function(e){if(!sw)return;sw=false;var dx=e.changedTouches[0].clientX-hx;if(Math.abs(dx)>40){heroGo(heroI+(dx>0?-1:1));}heroStart();});
  heroGo(0);
}
document.addEventListener('visibilitychange',function(){if(document.hidden){heroStop();}else if($('#hero')){heroStart();}});
function boot(){
  $('#bellBtn').innerHTML='<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>';
  addScreen(scHall);addScreen(scSearch);
  addScreen(function(){return scPub('express');});
  addScreen(function(){return scPub('daibuy');});
  addScreen(function(){return scPub('bangsong');});
  addScreen(scDetail);addScreen(scChat);addScreen(scRating);
  addScreen(scWallet);addScreen(scAddr);addScreen(scCoupon);addScreen(scStats);addScreen(scHelp);addScreen(scAuth);
  renderFeed();renderHomeActive();renderOrders();renderMsg();renderMe();renderWallet();refreshDots();
  calcCurPub();
  buildHero();heroStart();
  goTab('home');
  if(!S.onboarded){setTimeout(obShow,700);}
}
boot();
</script>
